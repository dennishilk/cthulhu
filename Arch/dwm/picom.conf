# Cthulhu — transparent kitty, subtle shadows, no blur or fading.
backend = "glx";
vsync = false;
fading = false;
shadow = true;
shadow-radius = 8;
shadow-opacity = 0.16;
shadow-offset-x = -4;
shadow-offset-y = -4;
shadow-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "_NET_WM_STATE@:32a *= '_NET_WM_STATE_FULLSCREEN'"
];
blur-method = "none";
unredir-if-possible = true;
