name: Cthulhu dwm 6.8 build

on:
  push:
    branches: [main]
    paths:
      - 'Arch/dwm/**'
      - '.github/workflows/cthulhu-dwm-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dwm build dependencies
        run: pacman -Syu --noconfirm --needed git base-devel pkgconf libx11 libxft libxinerama python
      - name: Verify shell and Python syntax
        run: |
          bash -n Arch/dwm/install.sh Arch/dwm/rebuild.sh
          sh -n Arch/dwm/start.sh
          python -m py_compile Arch/dwm/patch_dwm.py
      - name: Build official dwm 6.8 with Cthulhu customization
        run: |
          mkdir -p "$HOME/.config/dwm" "$HOME/.local/bin"
          git clone --depth 1 --branch 6.8 https://git.suckless.org/dwm "$HOME/.config/dwm/src"
          cp Arch/dwm/config.h Arch/dwm/patch_dwm.py Arch/dwm/rebuild.sh "$HOME/.config/dwm/"
          chmod +x "$HOME/.config/dwm/rebuild.sh"
          "$HOME/.config/dwm/rebuild.sh"
          test -x "$HOME/.local/bin/dwm"
      - name: Verify re-run is idempotent
        run: "$HOME/.config/dwm/rebuild.sh"
