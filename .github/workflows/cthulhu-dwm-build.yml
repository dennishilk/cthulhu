name: Cthulhu dwm 6.8 build

on:
  push:
    branches: [main]
    paths:
      - 'Arch/dwm/**'
      - '.github/workflows/cthulhu-dwm-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dwm build dependencies
        run: pacman -Syu --noconfirm --needed git base-devel pkgconf libx11 libxft libxinerama python
      - name: Verify shell and Python syntax
        run: |
          bash -n Arch/dwm/install.sh Arch/dwm/rebuild.sh
          sh -n Arch/dwm/start.sh
          python -m py_compile Arch/dwm/patch_dwm.py Arch/dwm/pacman-style.py
      - name: Build official dwm 6.8 as an unprivileged user
        run: |
          useradd -m -s /bin/bash builder
          mkdir -p /home/builder/.config/dwm /home/builder/.local/bin
          git clone --depth 1 --branch 6.8 https://git.suckless.org/dwm /home/builder/.config/dwm/src
          cp Arch/dwm/config.h Arch/dwm/patch_dwm.py Arch/dwm/rebuild.sh /home/builder/.config/dwm/
          chmod +x /home/builder/.config/dwm/rebuild.sh
          chown -R builder:builder /home/builder
          su - builder -c '/home/builder/.config/dwm/rebuild.sh'
          test -x /home/builder/.local/bin/dwm
      - name: Verify re-run is idempotent
        run: su - builder -c '/home/builder/.config/dwm/rebuild.sh'
